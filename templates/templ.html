<html>
<head>
<style>
</style>

<title>ResearchSpace Vis</title>

<!-- Load icon library -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="static/css/dashboard.css">

</head>

<body>

  <div class="row">
    <div class="column leftside">
      <div id="ccontainer" class="cards-container"> 
        <tt1>Selection <i class="fa fa-mouse-pointer" aria-hidden="true"></i></tt1>
      </div>
      <div class="search-container">
        <tt1>Search <i class="fa fa-search" aria-hidden="true"></i></tt1>
        <div class="search-form">
          <form class="example">
            <input type="text" id="myInput" onkeyup="filter_on_search()" placeholder="Search...">
          </form>
        </div>

        <table id="myTable" class="corpustb">
            <tr class="header">
              <th width="10%"></th>
              <th width="10%">Title</th>
              <th width="60%">Authors</th>
              <th width="10%">Year</th>
              <th width="10%">Venue</th>
            </tr>
        </table>

        <table id="myTableB" class="authortb">
          <tr class="header">
            <th width="90%">Author</th>
            <th width="10%">Publications</th>
          </tr>
        </table> 
      </div>
    </div>

    <div class="column middle">
      <div class="hex-container">
        <tt1>Layered Projection </tt1><i class="fa-solid fa-layer-group"></i>
        <div id="hex" class="center"></div>

        <div class="topRightHex overlay">
          <div class="toogle-container">
            <div class="layer-toggle">
              <div class="btn-toggler" id="tlayer">
                <img src="static/images/layersymbols/t.png" alt="Tracking">
              </div>
              <span class="toggle-label">Tracking</span>
            </div>
            <div class="layer-toggle">
              <div class="btn-toggle" id="hlayer">
                <img src="static/images/layersymbols/h.png" alt="Selection">
              </div>
              <span class="toggle-label">Selection</span>
            </div>
            <div class="layer-toggle-big">
              <div class="btn-toggle" id="clayer">
                <img src="static/images/layersymbols/c.png" alt="Concept">
              </div>
              <div class="inner">
                <span class="toggle-label">Concept</span>
                <div class="slidecontainer">
                  <input type="range" id="keywordnumslider" min="1" max="500" value="20" step="20">
                  <label class="mini-label">#Keys</label>
                </div>
              </div>
            </div>
            <div class="layer-toggle-big" >
              <div class="btn-toggle" id="blayer">
                <img src="static/images/layersymbols/b.png" alt="My Button">
              </div>
              <div class="inner">
                <span class="toggle-label">Binning</span>
                <div class="slidecontainer">
                  <input type="range" id="binsizeslider" name="volume" min="0" max="40" step="1">
                  <label class= "mini-label" for="volume">Binsize&Group</label>
                  <!-- <label class= "mini-label" for="volume">Radius</label> -->
                  <label class="switch">
                    <input type="checkbox" id="andorbox">
                    <div class="slider round">
                     <!--ADDED HTML -->
                     <span class="on">AND</span>
                     <span class="off">OR</span>
                     <!--END-->
                     <!--END-->
                    </div>
                   </label>
                </div>
              </div>
            </div>
            <div class="layer-toggle" >
              <div class="btn-toggle" id="alayer">
                <img src="static/images/layersymbols/a.png" alt="My Button">
              </div>
              <span class="toggle-label">Area</span>
            </div>
            <div class="layer-toggle">
              <div class="btn-toggle" id="nlayer">
                <img src="static/images/layersymbols/n.png" alt="Network">
              </div>
              <span class="toggle-label">Network</span>
            </div>
            <div class="layer-toggle">
              <div class="btn-toggle" id="rlayer">
                <img src="static/images/layersymbols/r.png" alt="Related">
              </div>
              <span class="toggle-label">Related</span>
            </div>
          </div>
          <div class="layer-toggle" >
            <div class="btn-toggle" id="slayer"> 
              <img src="static/images/layersymbols/s.png" alt="Seed">
            </div>
            <span class="toggle-label">Seed</span>
          </div>
          <button class="button" id="deselectButton">
            <i class="fa fa-times-circle-o" aria-hidden="true"></i> Clear
          </button>
        </div>
      </div>
      <div class="hex-container">
        <tt1>Timeline View</tt1>
        <div id="timeline-down" style="width: 100%; height: 300px;"></div>
      </div>      
    </div>

    <div class="column rightside">
      <div class="info-container">
        <div class="infoinner-container">
          <tt1>Information <i class="fa fa-info-circle" aria-hidden="true"></i></tt1>
        </div>
      </div>

      <div class="bibcard-container">
        <div class="bibcardinner-container">
          <tt1>Collection <i class="fa fa-bookmark" aria-hidden="true"></i></tt1>
        </div>
      </div>

      <button class="btn" style="width:100%">
        <a href="static/images/layersymbols/collection.bib" download>
          <i class="fa fa-download"></i> Download
        </a>
      </button>
    </div>
  </div>

  <!-- Load external libraries -->
  <script src="https://d3js.org/d3.v4.min.js"></script>
  <script src="https://d3js.org/d3-hexbin.v0.2.min.js"></script>
  <script src="//d3js.org/topojson.v1.min.js"></script>

  <!-- Load scripts -->
  <script src="static/js/external/figue.js"></script>
  <script src="static/js/external/color2D.js"></script>
  <script src="static/js/RadarChart.js"></script>
  <script src="static/js/data_prep.js"></script>
  <script src="static/js/dashboard-network.js"></script>
  <script src="static/js/dashboard.js" defer></script>


  <!-- Load JSON data into JavaScript -->
  <script type="text/javascript">
    const dataset = {};
  
    // Load all data files in parallel
    Promise.all([
      fetch("static/network.json").then(r => r.json()).then(d => { console.log("✅ network loaded"); dataset.network = d; }),
      fetch("static/papers.json").then(r => r.json()).then(d => { console.log("✅ papers loaded"); dataset.papers = d; }),
      fetch("static/seeds.json").then(r => r.json()).then(d => { console.log("✅ seeds loaded"); dataset.seeds = d; }),
      fetch("static/projections.json").then(r => r.json()).then(d => { console.log("✅ keys loaded"); dataset.keys = d; }),
      fetch("static/key_projections.json").then(r => r.json()).then(d => { console.log("✅ key_projections loaded"); dataset.key_projections = d; }),
      fetch("static/papers_with_keys.json").then(r => r.json()).then(d => { console.log("✅ papers_with_keys loaded"); dataset.pwk = d; }),
      fetch("static/paths.json").then(r => r.json()).then(d => { console.log("✅ paths loaded"); dataset.paths = d; }),
      fetch("static/authors.json").then(r => r.json()).then(d => { console.log("✅ authors loaded"); dataset.authors = d; })
    ])
    .then(() => {
      console.log("✅ All data loaded");
      startAppWhenDOMReady();
    })
    .catch(err => {
      console.error("❌ Error loading data:", err);
    });
  
    function startAppWhenDOMReady() {
      // Wait until DOM is fully parsed and ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", runApp);
      } else {
        runApp();
      }
    }
  
    function runApp() {
      console.log("🚀 DOM is ready, initializing app...");
      try {
        myVar = my_Func(
          dataset.network,
          dataset.papers,
          dataset.seeds,
          dataset.keys,
          dataset.key_projections,
          dataset.pwk,
          dataset.paths,
          dataset.authors
        );
      } catch (err) {
        console.error("❌ Error in my_Func:", err);
      }
    }
  </script>
  

</body>
</html>
